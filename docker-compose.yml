services:
  wec-mailing:
    build: .
    container_name: wec-mailing-agent
    ports:
      - "0.0.0.0:8004:3000"
    env_file: .env
    volumes:
      # Dane (szablony, kontakty, logi, użytkownicy) persystują między restartami
      - wec_data:/app/data
    restart: unless-stopped

volumes:
  wec_data:
